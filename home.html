<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Page Bidon</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#0f172a;
      color:white;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
    }

    .blob{
      position:absolute;
      width:400px;
      height:400px;
      background:linear-gradient(45deg,#7c3aed,#06b6d4);
      filter:blur(120px);
      opacity:0.5;
      border-radius:50%;
      animation:move 8s infinite alternate ease-in-out;
    }

    @keyframes move{
      from{
        transform:translate(-100px,-50px);
      }
      to{
        transform:translate(100px,50px);
      }
    }

    .card{
      position:relative;
      z-index:2;
      background:rgba(255,255,255,0.08);
      backdrop-filter:blur(12px);
      border:1px solid rgba(255,255,255,0.15);
      padding:40px;
      border-radius:24px;
      width:90%;
      max-width:500px;
      text-align:center;
      box-shadow:0 10px 40px rgba(0,0,0,0.4);
    }

    h1{
      font-size:3rem;
      margin-bottom:15px;
    }

    p{
      color:#cbd5e1;
      margin-bottom:25px;
      line-height:1.6;
    }

    button{
      background:white;
      color:#0f172a;
      border:none;
      padding:14px 28px;
      border-radius:999px;
      cursor:pointer;
      font-weight:bold;
      transition:0.3s;
    }

    button:hover{
      transform:scale(1.05);
      opacity:0.9;
    }

    .footer{
      margin-top:25px;
      font-size:0.85rem;
      color:#94a3b8;
    }
  </style>
</head>

<body>

  <div class="blob"></div>

  <div class="card">
    <h1>Page Bidon™</h1>

    <p>
      Ceci est une page HTML totalement inutile…
      mais étrangement stylée.
    </p>

    <button onclick="fakeAction()">
      Clique sans raison
    </button>

    <div class="footer">
      Version 0.0.1 — Aucun bug connu. Aucun intérêt non plus.
    </div>
  </div>

  <script>
    function fakeAction(){
      alert("Bravo. Tu viens d'interagir avec du vide numérique.");
    }
  </script>

</body>
</html>
